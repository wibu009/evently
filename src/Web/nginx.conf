server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
