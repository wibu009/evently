services:
  # ------------------------------------------------------------------
  # Applications
  # ------------------------------------------------------------------
  evently.gateway:
    image: ${DOCKER_REGISTRY-}evently-gateway
    container_name: evently.gateway
    build:
      context: .
      dockerfile: src/API/Evently.Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5002:8080"
      - "5003:8081"
    depends_on:
      - evently.api
      - evently.ticketing.api

  evently.web:
    image: ${DOCKER_REGISTRY-}evently-web
    container_name: evently.web
    build:
      context: ./src/Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_TICKETING_BASE_URL: http://localhost:5004
        VITE_OIDC_AUTHORITY: http://localhost:18080/realms/evently
        VITE_OIDC_CLIENT_ID: evently-public-client
    ports:
      - "3000:80"

  evently.api:
    image: ${DOCKER_REGISTRY-}evently-api
    container_name: evently.api
    build:
      context: .
      dockerfile: src/API/Evently.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      evently.write.db:
        condition: service_healthy
      evently.read.db:
        condition: service_healthy
      evently.cache:
        condition: service_healthy
      evently.queue:
        condition: service_healthy
      evently.idp:
        condition: service_healthy
      evently.seq:
        condition: service_started
      evently.trace:
        condition: service_started

  evently.ticketing.api:
    image: ${DOCKER_REGISTRY-}evently-ticketing-api
    container_name: evently.ticketing.api
    build:
      context: .
      dockerfile: src/API/Evently.Ticketing.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5004:8080"
      - "5005:8081"
    depends_on:
      evently.write.db:
        condition: service_healthy
      evently.read.db:
        condition: service_healthy
      evently.cache:
        condition: service_healthy
      evently.queue:
        condition: service_healthy
      evently.idp:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------
  evently.write.db:
    image: postgres:17.5
    container_name: evently.write.database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evently
    volumes:
      - ./.containers/database/write:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 5s
      timeout: 5s
      retries: 12

  evently.read.db:
    image: mongo:8.2
    container_name: evently.read.database
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - ./.containers/database/read:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "admin", "-u", "admin", "-p", "admin", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 10s
      retries: 12

  evently.idp:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: evently.identity
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_TRACING_ENABLED=true
      - KC_TRACING_ENDPOINT=http://evently.trace:4317
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
      - ./.files/providers/evently-keycloak-theme.jar:/opt/keycloak/providers/evently-keycloak-theme.jar:ro
    ports:
      - "18080:8080"
      - "9000:9000"
    command:
      - start-dev
      - --import-realm
    healthcheck:
      # The Keycloak image ships bash but not curl; drive an HTTP GET over /dev/tcp
      # against the management health endpoint and require a 200.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  evently.seq:
    image: datalust/seq:2025.1
    container_name: evently.sequence
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341"
      - "8082:80"

  evently.cache:
    image: redis:8.0.2
    container_name: evently.redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  evently.trace:
    image: jaegertracing/all-in-one:1.72.0
    container_name: evently.jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"

  evently.queue:
    image: rabbitmq:4.1.3-management-alpine
    container_name: evently.queue
    hostname: evently-queue
    volumes:
      - ./.containers/queue/data/:/var/lib/rabbitmq
      - ./.containers/queue/log/:/var/log/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
